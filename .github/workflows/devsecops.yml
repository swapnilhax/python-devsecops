name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. GITLEAKS - SECRET SCANNING
  # ==========================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
syft:
    name: Syft SBOM GENERATION
    runs-on: ubuntu-latest
        steps:
            name: sbom generation
            uses: anchore/sbom-action@v0
            with:
              path: .
              format: cyclonedx
              output: sbom.json

             name: Syft SBOM Upload
             uses: actions/upload-artifact@v4
             with:
                name: syft_sbom
                path: sbom.json


  # ==========================================
  # 2. TRIVY - FILESYSTEM + SBOM
  # ==========================================
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: 0

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.json
          exit-code: 0

      - name: Upload source SBOM
        uses: actions/upload-artifact@v4
        with:
          name: source-sbom
          path: sbom.json


  # ==========================================
  # 3. DOCKER IMAGE BUILD
  # ==========================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - trivy-fs

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t python-devsecops:${{ github.sha }} \
            .

      - name: List Docker images
        run: docker images


  # ==========================================
  # 4. TRIVY - DOCKER IMAGE SCAN
  # ==========================================
  trivy-image:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-latest

    needs: docker-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t python-devsecops:${{ github.sha }} \
            .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: python-devsecops:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: table
          exit-code: 0

      - name: Generate Docker image SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: python-devsecops:${{ github.sha }}
          format: cyclonedx
          output: image-sbom.json
          exit-code: 0

      - name: Upload Docker image SBOM
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-sbom
          path: image-sbom.json

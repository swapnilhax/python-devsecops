name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read


jobs:

  # ==========================================
  # 1. GITLEAKS - SECRET SCANNING
  # ==========================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Gitleaks
        run: gitleaks dir .

  # ==========================================
  # 2. TRIVY - FILESYSTEM SCAN
  # ==========================================
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    needs: gitleaks

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: 0


  # ==========================================
  # 3. BUILD DOCKER IMAGE - BUILD ONLY ONCE
  # ==========================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs: trivy-fs

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t python-devsecops:${{ github.sha }} \
            .

      - name: List Docker images
        run: |
          docker images

      # Save Docker image as TAR file
      - name: Save Docker image
        run: |
          docker save \
            python-devsecops:${{ github.sha }} \
            -o python-devsecops.tar

      # Upload Docker image to GitHub artifact
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: python-devsecops.tar
          retention-days: 1


  # ==========================================
  # 4. TRIVY - DOCKER IMAGE SCAN
  # ==========================================
  trivy-image:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-latest

    needs: docker-build

    steps:

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      # Load the exact image built in previous job
      - name: Load Docker image
        run: |
          docker load \
            -i python-devsecops.tar

      - name: Verify Docker image
        run: |
          docker images

      # Scan the exact Docker image
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: python-devsecops:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: 0


  # ==========================================
  # 5. SYFT - GENERATE IMAGE SBOM
  # ==========================================
  syft:
    name: Generate Docker Image SBOM
    runs-on: ubuntu-latest

    needs: trivy-image

    steps:

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      # Load exact Docker image
      - name: Load Docker image
        run: |
          docker load \
            -i python-devsecops.tar

      - name: Verify Docker image
        run: |
          docker images

      # Generate SBOM using Syft
      - name: Generate SBOM using Syft
        uses: anchore/sbom-action@v0
        with:
          image: python-devsecops:${{ github.sha }}
          format: cyclonedx-json
          output-file: image-sbom.json

      # Upload Syft SBOM
      - name: Upload Syft SBOM
        uses: actions/upload-artifact@v4
        with:
          name: syft-image-sbom
          path: image-sbom.json
          retention-days: 1


  # ==========================================
  # 6. TRIVY - SCAN SYFT SBOM
  # ==========================================
  trivy-sbom:
    name: Trivy SBOM Scan
    runs-on: ubuntu-latest

    needs: syft

    steps:

      # Download the SBOM generated by Syft
      - name: Download Syft SBOM
        uses: actions/download-artifact@v4
        with:
          name: syft-image-sbom

      # Scan Syft-generated SBOM
      - name: Scan Syft SBOM with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          input: image-sbom.json
          scan-type: sbom
          severity: HIGH,CRITICAL
          format: table
          exit-code: 0
